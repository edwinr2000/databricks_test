# This is a Declarative Automation Bundle definition for databricks_test.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_test
  uuid: c48c1ce0-888a-4b4e-bdbc-f4f67c828105

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # Entorno local/individual protegido por la regla de usuario del CLI
    mode: development
    default: true
    workspace:
      host: https://dbc-804cc929-f662.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}

  uat:
    # Entorno compartido de pruebas (alimentado desde main) sin restricciones de usuario
    mode: production
    workspace:
      host: https://dbc-804cc929-f662.cloud.databricks.com
      root_path: /Workspace/Repos/bundle_uat/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: uat

  prod:
    # Entorno oficial de producción
    mode: production
    workspace:
      host: https://dbc-804cc929-f662.cloud.databricks.com
      root_path: /Workspace/Repos/bundle_prod/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: edwin.torres.r2000@gmail.com
        level: CAN_MANAGE